name: Build Android APK
on:
  push:
    branches: ['main', 'arena/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check widget resources and fonts
        run: |
          pip install fonttools==4.60.1
          python -m unittest discover -s tests -v
      - name: Build and lint
        run: gradle --no-daemon assembleDebug lintDebug testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: Arabic-Clock-APK
          path: app/build/outputs/apk/debug/app-debug.apk
  release:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: Arabic-Clock-APK
          path: release-apk
      - name: Prepare draft test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle)
          test -n "$VERSION"
          APK="Arabic-Clock-${VERSION}.apk"
          cp release-apk/app-debug.apk "$APK"
          sha256sum "$APK" > SHA256SUMS.txt
          gh release create "v${VERSION}" --target "$GITHUB_SHA" --draft --prerelease \
            --title "Arabic Clock ${VERSION} — Test Release" --notes-file RELEASE_NOTES.md \
            "$APK" SHA256SUMS.txt
